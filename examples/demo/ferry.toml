# Demo: Cassandra 1 → Scylla 1 (official images).
# From the Mac, Docker publishes 9042/9043 on localhost — keep contact_points_only
# so the driver does not chase unreachable container peer IPs.

[migration]
name = "odyssey-demo-cass-to-scylla"

[source]
kind = "cql"
contact_points = ["127.0.0.1:9042"]
datacenter = "datacenter1"
consistency = "one"
contact_points_only = true

[target]
contact_points = ["127.0.0.1:9043"]
datacenter = "datacenter1"
consistency = "one"
contact_points_only = true

[[tables]]
source = "ferry_demo.events"
target = "ferry_demo.events"

[engine]
workers = 8
page_size = 5000
write_batch_size = 10
preserve_writetimes = true
preserve_ttls = true

[engine.concurrency]
initial = 64
minimum = 16
maximum = 256

[engine.adaptive]
enabled = true
target_p99_ms = 25

[checkpoint]
path = "./.odyssey/demo-migration.db"
interval_secs = 2

[validation]
mode = "digest"
sample_size = 500
compare_timestamps = false
writetime_tolerance_us = 1000000
ttl_tolerance_secs = 60

[logging]
verbosity = "info"
format = "text"

[metrics]
enabled = true
listen_addr = "127.0.0.1:9100"

[ui]
enabled = true
listen_addr = "127.0.0.1:9080"
# Local demos finish in seconds; keep the page open so you can open the browser.
hold_secs = 120

[notify]
# Optional Slack/generic webhook (JSON POST with `text` + `event`).
# webhook_url = "https://hooks.slack.com/services/..."
on_complete = true
on_error = true
timeout_secs = 5

[live]
enabled = false

[integrity]
guarantee = "at_least_once"
fail_unit_on_write_error = true
require_checkpoint_before_complete = true
checkpoint_on_cancel = true
