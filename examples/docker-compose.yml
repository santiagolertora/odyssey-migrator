# Local single-node smoke test (official images).
# Prefer examples/demo/ for the real 3+3 demo.

services:
  cassandra:
    image: cassandra:4.1
    ports: ["9042:9042"]
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'"]
      interval: 10s
      timeout: 10s
      retries: 30

  scylla:
    image: scylladb/scylla:5.4
    command:
      [
        "--smp", "1",
        "--memory", "750M",
        "--overprovisioned", "1",
        "--developer-mode", "1",
      ]
    ports: ["9043:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
